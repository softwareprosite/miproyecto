version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bolivia_postgres
    environment:
      POSTGRES_USER: bolivia_user
      POSTGRES_PASSWORD: Bolivia@2024
      POSTGRES_DB: bolivia_tourism_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bolivia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolivia_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolivia_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: bolivia_user
      DB_PASSWORD: Bolivia@2024
      DB_NAME: bolivia_tourism_db
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bolivia_network
    volumes:
      - ./backend/src:/app/src
    command: npm run start:prod

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: bolivia_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - bolivia_network
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:

networks:
  bolivia_network:
    driver: bridge
